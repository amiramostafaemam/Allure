<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("allure-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "forest");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet" />

    <!-- Default, sitewide meta — the backend swaps these for a specific
         product's own title/description/photo on /product/:slug requests
         (see backend/src/middleware/productMetaHtml.ts), since a crawler
         reads the raw HTML and never runs the SPA's JS. -->
    <title>Allure</title>
    <meta name="description" content="Curated hardware and workspace tools — audio, wearables, workspace and travel gear, ready to ship." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allure" />
    <meta property="og:title" content="Allure" />
    <meta property="og:description" content="Curated hardware and workspace tools — audio, wearables, workspace and travel gear, ready to ship." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allure" />
    <meta name="twitter:description" content="Curated hardware and workspace tools — audio, wearables, workspace and travel gear, ready to ship." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
