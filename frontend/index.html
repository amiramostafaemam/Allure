<!doctype html>
<html lang="en" dir="ltr" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <!-- Default dark value — the inline script right below overwrites it to
         #f6faf6 when the resolved theme is light, so the browser chrome/
         status bar tint always matches whichever theme actually applied,
         not just the OS's own light/dark preference (the in-app toggle can
         diverge from that). Must stay ahead of the script in source order:
         a script can only find elements the parser has already reached. -->
    <meta name="theme-color" content="#1b1717" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("allure-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "forest");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f6faf6" : "#1b1717");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Allure" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Default, sitewide meta — the backend swaps these for a specific
         product's own title/description/photo on /product/:slug requests
         (see backend/src/middleware/productMetaHtml.ts), since a crawler
         reads the raw HTML and never runs the SPA's JS. -->
    <title>Allure</title>
    <meta name="description" content="Curated everyday essentials — tech, apparel, and lifestyle goods, ready to ship." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allure" />
    <meta property="og:title" content="Allure" />
    <meta property="og:description" content="Curated everyday essentials — tech, apparel, and lifestyle goods, ready to ship." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allure" />
    <meta name="twitter:description" content="Curated everyday essentials — tech, apparel, and lifestyle goods, ready to ship." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
